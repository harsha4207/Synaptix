    <!-- Early Theme Application Script (Prevents flash of light theme on reload) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('synaptix_user_preferences_v1');
          if (raw) {
            var prefs = JSON.parse(raw);
            var theme = prefs.theme || 'light';
            var effectiveTheme = theme;
            if (theme === 'system') {
              var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              effectiveTheme = systemDark ? 'dark' : 'light';
            }
            if (effectiveTheme === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
              document.documentElement.classList.add('theme-dark');
            } else {
              document.documentElement.setAttribute('data-theme', 'light');
              document.documentElement.classList.remove('theme-dark');
            }
            if (prefs.displayDensity) {
              document.documentElement.setAttribute('data-density', prefs.displayDensity);
            }
            if (prefs.reducedMotion) {
              document.documentElement.setAttribute('data-reduced-motion', 'true');
            }
          }
        } catch (e) {}
      })();
    </script>
